aid: foresight-mental-health
name: Foresight Mental Health
description: 'Foresight Mental Health is a Berkeley, California technology-enabled outpatient
  behavioral health organization founded in 2018 by UC Berkeley computer science students
  Doug Hapeman and Matt Milford to widen access to insurance-covered therapy and psychiatry.
  It delivers virtual and in-person care through its own clinics in California and Georgia
  plus partner locations in Arizona, Florida and Texas, covering psychiatry and medication
  management, individual and couples therapy (CBT, DBT-informed care, EMDR, ACT, Gottman
  Method, play therapy), child and adolescent services, a maternal mental health program,
  ADHD/IVA-2 CPT testing, intensive outpatient services in California and transcranial
  magnetic stimulation in Georgia. The company acquired Psychiatric Addictive Curative
  Therapies (PACT) Atlanta and has raised roughly $17.7M across pre-seed through Series C
  with investors including Polaris Partners. Its clinical technology stack is bought rather
  than built and patient-facing: scheduling runs through Zocdoc and the patient portals are
  operated by third parties — AdvancedMD for California patients and athenahealth elsewhere.
  Foresight publishes no developer program, no API documentation, and no machine-readable API
  contract; the only machine-readable documents on its host are a Yoast-generated llms.txt,
  a sitemap index and the marketing site''s stock WordPress core REST API at /wp-json/.'
